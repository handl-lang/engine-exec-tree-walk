[package]
name = "hnl-engine-exec-tree-walk"
version = "0.1.0"
edition = "2024"
description = "The reference interpreter for the eval operation (ADR-0044 §3, §4, ADR-0052). Interprets the arrow-calculus [`handl_language::Term`] kernel directly via tree-walking: it looks ..."
license = "MIT"
repository = "https://github.com/handl-lang/engine-exec-tree-walk"
homepage = "https://handl-lang.github.io/docs/engine-exec-tree-walk/"
documentation = "https://handl-lang.github.io/docs/engine-exec-tree-walk/reference/"
readme = "README.md"
keywords = ["handl", "engine", "eval", "interpreter", "tree-walk"]
categories = ["development-tools", "compilers"]
# Git-install only: https://github.com/handl-lang/engine-exec-tree-walk (no crates.io).
publish = false

[dependencies]
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
hnl-engine-exec = { git = "https://github.com/handl-lang/engine-exec", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"
rustc-hash = "2"
stacker = "0.1"

[dev-dependencies]
handl-test-utils = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-module = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-engine-exec-bytecode = { git = "https://github.com/handl-lang/engine-exec-bytecode", branch = "main" }
serde_json = "1"
handl-kit-data-prelude = { git = "https://github.com/handl-lang/kit-data-prelude", branch = "main" }
